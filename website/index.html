<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seraph Engine Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col">

    <header class="border-b border-gray-800 bg-gray-900/50 p-4 backdrop-blur">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="h-3 w-3 rounded-full bg-indigo-500 animate-pulse"></div>
                <h1 class="text-xl font-bold tracking-wide text-indigo-400">SERAPH::ENGINE</h1>
            </div>
            <div id="status-badge" class="status-disconnected">
                Disconnected
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-between overflow-hidden">
        
        <div id="chat-log" class="flex-1 space-y-4 overflow-y-auto pr-2 custom-scrollbar mb-4 py-4">
            <div class="flex gap-3 max-w-2xl">
                <div class="avatar-system">S</div>
                <div class="bubble-system">
                    System active. Web control dashboard linked. Send a command to engage the GPU cluster.
                </div>
            </div>
        </div>

        <form id="prompt-form" class="relative flex items-center bg-gray-900 border border-gray-800 rounded-2xl focus-within:border-indigo-500 transition shadow-2xl">
            <textarea 
                id="prompt-input" 
                rows="1" 
                placeholder="Message Seraph..." 
                class="w-full bg-transparent resize-none py-4 pl-4 pr-16 focus:outline-none text-gray-200 text-sm max-h-32 overflow-y-auto"
                required
            ></textarea>
            <button 
                type="submit" 
                id="send-btn"
                disabled
                class="absolute right-3 p-2 rounded-xl bg-gray-800 hover:bg-indigo-600 disabled:opacity-40 disabled:hover:bg-gray-800 text-white transition cursor-pointer"
            >
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" />
                </svg>
            </button>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
