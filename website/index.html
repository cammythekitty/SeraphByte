<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seraph Engine Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="theme.css?v=remodel_final">
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col">

    <header class="border-b border-gray-900 bg-gray-900/40 py-2.5 px-4 backdrop-blur">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="h-2 w-2 rounded-full bg-indigo-500 animate-pulse"></div>
                <div>
                    <h1 class="text-sm font-bold tracking-widest text-indigo-400 font-mono leading-tight">SERAPH::ENGINE</h1>
                    <p id="model-line" class="text-[10px] text-gray-500 font-mono tracking-wide">fetching metadata · ws://127.0.0.1:8543</p>
                </div>
            </div>
            <div id="status-badge" class="status-disconnected">
                Disconnected
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto flex flex-col p-4 overflow-hidden">
        <div id="chat-log" class="flex-1 overflow-y-auto pr-2 space-y-4 custom-scrollbar">
            <div class="flex gap-3 max-w-2xl msg-row-system">
                <div class="avatar-system">S</div>
                <div>
                    <div class="bubble-system markdown-body">
                        System environment restored. Web interface bound to core workspace pipeline loops. Engage the hardware cluster.
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-2">
            <form id="prompt-form" class="relative flex items-center bg-gray-900 border border-gray-800 rounded-2xl focus-within:border-indigo-500/50 transition shadow-2xl">
                <textarea
                    id="prompt-input"
                    rows="1"
                    placeholder="Message Seraph..."
                    class="w-full bg-transparent resize-none py-3.5 pl-4 pr-16 focus:outline-none text-gray-200 text-sm max-h-32 overflow-y-auto"
                    required
                ></textarea>
                <button
                    type="submit"
                    id="send-btn"
                    disabled
                    class="absolute right-3 p-1.5 rounded-xl bg-gray-800 hover:bg-indigo-600 disabled:opacity-30 disabled:hover:bg-gray-800 text-white transition cursor-pointer"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" />
                    </svg>
                </button>
            </form>
            
            <div class="context-bar mt-1 px-1 flex justify-end">
                <span id="ctx-label">ctx: 0 / 8,192 tok</span>
            </div>
        </div>
    </main>

    <script src="app.js?v=remodel_final"></script>
</body>
</html>
