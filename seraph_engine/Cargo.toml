[package]
name = "seraph_engine"
version = "0.1.0"
edition = "2021"
authors = ["Cammy"]
description = "High-performance async LLM inference backend for SeraphByte"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
candle-core = { git = "https://github.com/huggingface/candle", branch = "main", features = ["cuda"] }
candle-transformers = { git = "https://github.com/huggingface/candle", branch = "main" }
candle-nn = { git = "https://github.com/huggingface/candle", branch = "main", features = ["cuda"] }
tokenizers = "0.23"
dirs = "5.0"
tokio-tungstenite = "0.23"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[patch.crates-io]
cudarc = { git = "https://github.com/coreylowman/cudarc.git" }