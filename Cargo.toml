[package]
name = "seraph_engine"
version = "0.3.0"
edition = "2021"
authors = ["Cammy"]
description = "SeraphByte: local LLM inference engine with a desktop interface"

[dependencies]
candle-core = { git = "https://github.com/huggingface/candle", branch = "main", features = ["cuda"] }
candle-transformers = { git = "https://github.com/huggingface/candle", branch = "main" }
candle-nn = { git = "https://github.com/huggingface/candle", branch = "main", features = ["cuda"] }
dirs = "5.0"
tungstenite = "0.23"
serde_json = "1.0"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
cudarc = "0.19.10"
wry = "0.53"
tao = "0.34"
tracing = "0.1"
